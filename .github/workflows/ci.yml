name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PyTorch CPU
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.3.0 torchvision==2.3.0 torchaudio==2.3.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install NVTX mock bindings
        run: |
          pip install git+https://github.com/YaoYinYing/nvtx-mock --force-reinstall
          pip install nvtx

      - name: Install graph dependencies
        run: |
          pip install "dgl<=2.4.0" -f https://data.dgl.ai/wheels/repo.html
          pip install pyg_lib torch_scatter torch_sparse torch_cluster torch_spline_conv -f https://data.pyg.org/whl/torch-2.3.0+cpu.html
          pip install torch_geometric

      - name: Install project
        run: |
          pip install -e .

      - name: Run smoke tests
        run: |
          python -m pytest -q tests/smoke
